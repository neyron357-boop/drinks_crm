<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<meta name="description" content="QR Склад — быстрый сканер QR-кодов для учёта товаров с экспортом в PDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR Склад">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preload" href="vendor/zxing_reader.wasm" as="fetch" type="application/wasm" crossorigin>
<title>QR Склад</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" crossorigin="anonymous">
<style>
/* Layout: камера во весь экран и одна карточка товара под большим пальцем; «Итоги» — спокойный список с деталями в одно касание */
:root{
  --bg:#F2F3F5;--surface:#FFFFFF;--surface-2:#E9EBEF;--ink:#0F1217;--ink-2:#4A5260;--muted:#6E7684;--line:#DDE1E6;
  --accent:#2747D0;--accent-soft:#E3E8FB;--ok:#12864A;--ok-bg:#DDF3E6;--dup:#8F5400;--dup-bg:#FCEFD3;--bad:#C8323A;--bad-bg:#FBE4E5;--on-ink:#FFFFFF;
  --cam-glass:rgba(16,18,22,.56);--cam-glass-solid:rgba(16,18,22,.86);--cam-text:#FFFFFF;--cam-dim:rgba(255,255,255,.68);--cam-line:rgba(255,255,255,.16);
  --glow-ok:#34D27F;--glow-dup:#FFB020;--glow-bad:#FF4D4F;--shade:rgba(0,0,0,.35);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --kb:0px;--vvh:100vh;--tabh:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D10;--surface:#15181D;--surface-2:#1E2228;--ink:#ECEFF3;--ink-2:#B2B9C4;--muted:#8A92A0;--line:#2A2F37;
  --accent:#8FA3FF;--accent-soft:#1C2445;--ok:#3DD68C;--ok-bg:#0F2A1C;--dup:#F5B841;--dup-bg:#3A2A0E;--bad:#FF6B6F;--bad-bg:#3A1416;--on-ink:#0B0D10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D10;--surface:#15181D;--surface-2:#1E2228;--ink:#ECEFF3;--ink-2:#B2B9C4;--muted:#8A92A0;--line:#2A2F37;
  --accent:#8FA3FF;--accent-soft:#1C2445;--ok:#3DD68C;--ok-bg:#0F2A1C;--dup:#F5B841;--dup-bg:#3A2A0E;--bad:#FF6B6F;--bad-bg:#3A1416;--on-ink:#0B0D10;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-touch-callout:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gut{padding-left:var(--gl);padding-right:var(--gr)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;overflow:hidden}

/* ---------- scan ---------- */
#v-scan{background:#000;color:var(--cam-text);--fx:50%;--fy:30%;--fs:260px;--bandTop:60px;--bandBot:200px}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;opacity:0;transition:opacity .2s}
#v-scan.live #video{opacity:1}
.frame{position:absolute;left:var(--fx);top:var(--fy);width:var(--fs);height:var(--fs);border-radius:6px;box-shadow:0 0 0 200vmax var(--shade);pointer-events:none;--corner:#fff;opacity:0;transition:opacity .2s}
#v-scan.live .frame{opacity:1}
.frame i{position:absolute;width:28px;height:28px;border:3px solid var(--corner);transition:border-color .15s}
.frame i:nth-child(1){left:-3px;top:-3px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.frame i:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.frame i:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.frame i:nth-child(4){right:-3px;bottom:-3px;border-left:0;border-top:0;border-bottom-right-radius:6px}
#v-scan.nosel .frame i{opacity:.4}
.frame.f-ok{--corner:var(--glow-ok)}.frame.f-dup{--corner:var(--glow-dup)}.frame.f-bad{--corner:var(--glow-bad)}
.frame-hint{position:absolute;left:var(--fx);top:var(--fy);width:var(--fs);height:var(--fs);display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.frame-hint span{padding:10px 16px;border-radius:999px;background:var(--cam-glass)}

.glass{background:var(--cam-glass);color:var(--cam-text);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);box-shadow:inset 0 0 0 1px var(--cam-line)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--cam-glass-solid)}}
.cam-top{position:absolute;left:0;right:0;top:calc(var(--sat) + 8px);height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
.total{height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.tools{display:flex;gap:8px}
.tool{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.tool .ic{width:22px;height:22px}
.tool[aria-pressed="true"]{background:#fff;color:#0F1217}
.tool.zoom{width:auto;min-width:44px;padding:0 12px;border-radius:22px;font-weight:700;font-size:14px}

.status{position:absolute;left:50%;top:calc(var(--fy) + var(--fs) + 12px);transform:translateX(-50%);z-index:3;max-width:calc(100% - 32px);min-height:44px;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;border-radius:22px;font-weight:500;font-size:15px;white-space:nowrap}
.status .st-t{overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.status .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--cam-dim)}
.status.k-ok .dot{background:var(--glow-ok)}.status.k-dup .dot{background:var(--glow-dup)}.status.k-bad .dot{background:var(--glow-bad)}
.status .st-a{flex:none;height:34px;padding:0 12px;border-radius:17px;background:#fff;color:#0F1217;font-weight:600;font-size:14px}
.status:not(:has(.st-a:not([hidden]))){padding-right:6px}

.cam-bottom{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + var(--sab) + 12px);display:flex;flex-direction:column;gap:10px;z-index:3}
.lane{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;scroll-padding:0 16px}
.lane::-webkit-scrollbar{display:none}
.lchip{flex:none;height:36px;max-width:230px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.lchip span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lchip b{flex:none;font-weight:700}
.lchip.on{background:#fff;color:#0F1217;box-shadow:none}
.lchip.add{font-weight:600}
.cam-row{display:flex;align-items:stretch;gap:8px}
.undo{width:52px;height:52px;align-self:center;border-radius:50%;display:grid;place-items:center;flex:none}
.undo:disabled{opacity:.4;cursor:default}
.card{flex:1;min-width:0;min-height:72px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:18px;background:#fff;color:#0F1217;text-align:left;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:box-shadow .24s var(--ease);user-select:none;-webkit-user-select:none}
.card.flash{box-shadow:0 0 0 3px #4C6BFF,0 6px 24px rgba(0,0,0,.25)}
.card.pulse{animation:pulse 1.1s var(--ease) 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,107,255,.0),0 6px 24px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 6px rgba(76,107,255,.55),0 6px 24px rgba(0,0,0,.25)}}
.card-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card-name{font-weight:600;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card-sub{font-size:13px;font-weight:500;color:#4A5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub.warn{color:#C8323A}
.card-r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.card-qty{font-size:36px;line-height:1;font-weight:700;letter-spacing:-.02em}
.card-qty.pop{animation:pop .18s var(--ease)}
@keyframes pop{50%{transform:scale(1.12)}}
.card-unit{font-size:13px;font-weight:500;color:#4A5260;margin-top:3px;white-space:nowrap}

.camstate{position:absolute;left:0;right:0;top:var(--bandTop);bottom:var(--bandBot);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.camstate h2{margin:0;font-size:19px;font-weight:700;line-height:1.25;text-wrap:balance}
.camstate p{margin:0;max-width:34ch;color:var(--cam-dim);font-size:14px;line-height:1.45;text-wrap:pretty}
.camstate .cs-note{font-size:13px}
.cs-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.cbtn.pri{background:#fff;color:#0F1217}
.cbtn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.cbtn.link{background:none;color:#fff;text-decoration:underline;text-underline-offset:3px;height:auto;padding:6px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tapall{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:600;font-size:17px}

#glow{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;--g:transparent;box-shadow:inset 0 0 0 6px var(--g),inset 0 0 48px var(--g)}
#glow.on{animation:glow var(--gd,220ms) ease-out}
@keyframes glow{0%{opacity:1}100%{opacity:0}}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:var(--surface);border-top:1px solid var(--line)}
.tabbar.dark{background:var(--cam-glass);color:#fff;border-top-color:var(--cam-line);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar.dark .tab{color:rgba(255,255,255,.6)}
.tab[aria-selected="true"]{color:var(--ink)}
.tabbar.dark .tab[aria-selected="true"]{color:#fff}
.tab .ic{width:24px;height:24px}

/* ---------- Итоги ---------- */
#v-sum{background:var(--bg);display:flex;flex-direction:column}
.sum-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--tabh) + var(--sab) + 84px)}
.wrap{max-width:720px;margin:0 auto}
.sum-head{position:sticky;top:0;z-index:4;background:var(--bg);padding-top:calc(var(--sat) + 14px);padding-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sum-head h1{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.sum-head p{margin:2px 0 0;font-size:13px;font-weight:500;color:var(--muted)}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn:hover{background:var(--surface-2)}
.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.35}
.bar span{flex:1;min-width:0}
.bar.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.bar .sbtn{flex:none}
.search{position:relative;margin-bottom:6px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 44px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.search .x{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;font-size:22px;line-height:1;color:var(--muted)}
.ghead{position:sticky;z-index:2;top:var(--stickTop,0px);display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:14px;padding-bottom:6px;background:var(--bg);font-size:13px;font-weight:600;color:var(--ink-2)}
.ghead small{font-size:13px;font-weight:500;color:var(--muted)}
.list{margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:9px 12px 9px 14px;text-align:left;border-top:1px solid var(--line)}
.list > li:first-child > .row,.list > .row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-n{font-weight:500;font-size:15px;line-height:1.3;display:flex;align-items:center;gap:6px;word-break:break-word}
.row-s{font-size:13px;color:var(--muted);font-weight:500}
.row-r{flex:none;display:flex;align-items:baseline;gap:4px}
.row-r b{font-size:20px;font-weight:700}
.row-r span{font-size:13px;color:var(--muted);font-weight:500}
.row .chev{width:18px;height:18px;color:var(--muted);align-self:center}
.half{flex:none;display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:600;line-height:1}
.mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 8px 24px}
.empty .ic{width:44px;height:44px;color:var(--muted);stroke-width:1.6}
.empty h2{margin:4px 0 0;font-size:19px;font-weight:700}
.empty p{margin:0;max-width:34ch;color:var(--muted);line-height:1.45}
.sum-foot{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + var(--sab));z-index:3;padding-top:12px;padding-bottom:12px;background:linear-gradient(transparent,var(--bg) 40%)}
.sum-foot .wrap{display:flex}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:12px;font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.out{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.sm{height:44px;font-size:15px;padding:0 16px}
.btn:disabled{opacity:.45;cursor:default}
.btn .ic{width:20px;height:20px}
.sbtn{height:36px;padding:0 12px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.tbtn{height:44px;padding:0 6px;font-weight:600;color:var(--accent);white-space:nowrap}
.tbtn.bad{color:var(--bad)}
.tbtn:disabled{color:var(--muted);cursor:default}

/* ---------- detail screen ---------- */
.screen{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s var(--ease)}
.screen.open{transform:none}
.scr-head{flex:none;padding-top:calc(var(--sat) + 6px);padding-bottom:4px;background:var(--bg)}
.back{height:44px;display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--accent);padding-right:8px}
.back .ic{width:22px;height:22px}
.scr-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--sab) + 96px)}
.d-name{margin:4px 0 2px;font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance;word-break:break-word}
.d-cat{font-size:13px;color:var(--muted);font-weight:500}
.d-qty{margin-top:14px;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em}
.d-qty small{font-size:17px;font-weight:600;margin-left:4px;letter-spacing:0}
.d-meta{margin-top:6px;font-size:14px;color:var(--muted);font-weight:500}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:10px 14px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.switchrow > span{display:flex;flex-direction:column;gap:1px}
.switchrow small{color:var(--muted);font-size:13px;font-weight:500}
.sw{position:relative;flex:none;width:51px;height:31px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .16s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .16s var(--ease)}
.sw input:checked + i{background:var(--ok);box-shadow:none}
.sw input:checked + i::after{transform:translateX(20px)}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.d-acts{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 8px;font-size:15px;font-weight:600}
.crow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 14px;text-align:left;border-top:1px solid var(--line);user-select:none;-webkit-user-select:none}
.list > .crow:first-child{border-top:0}
.crow .num{min-width:32px;color:var(--muted);font-size:13px;font-weight:500}
.crow code{flex:1;min-width:0;font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden}
.crow time{color:var(--muted);font-size:13px}
.crow .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.crow.sel{background:var(--accent-soft)}
.crow.sel .ck{border-color:var(--accent);background:var(--accent);color:var(--on-ink)}
.crow .ck .ic{width:14px;height:14px;stroke-width:3;opacity:0}
.crow.sel .ck .ic{opacity:1}
.crow.hl{animation:hl 1.2s ease-out}
@keyframes hl{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;align-items:center;gap:4px;padding-top:8px;padding-bottom:calc(var(--sab) + 8px);background:var(--surface);border-top:1px solid var(--line)}
.selbar b{flex:1;font-weight:600}
.d-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .24s var(--ease)}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);margin:0 auto;max-width:720px;max-height:calc(var(--vvh) - var(--sat) - 12px);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.24);transform:translateY(105%);transition:transform .24s var(--ease);outline:none}
.sheet.open{transform:none}
.sheet.tall{height:calc(min(92vh, var(--vvh) - var(--sat) - 12px))}
.sh-head{flex:none;padding-top:8px;touch-action:none;cursor:grab}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sh-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.sh-bar h2{margin:0;font-size:17px;font-weight:700;line-height:1.25;min-width:0}
.sh-bar .tbtn{flex:none}
.sh-bar > span{display:flex;align-items:center;gap:4px;flex:none}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:6px;padding-bottom:calc(16px + var(--sab))}
.sheet.kbopen .sh-body{padding-bottom:16px}
.sec{margin-top:18px}
.sec:first-child{margin-top:4px}
.sec h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hint{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.mitem{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 2px;text-align:left;border-top:1px solid var(--line);font-size:16px;font-weight:500}
.mitem:first-child{border-top:0}
.mitem .ic{color:var(--ink-2)}
.mitem span{flex:1}
.mitem small{color:var(--muted);font-size:14px}
.mitem.bad{color:var(--bad)}.mitem.bad .ic{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 > *{min-width:0}
.row2 .btn{padding:0 10px;white-space:normal;text-align:center;line-height:1.2}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* picker */
.p-tools{flex:none;padding-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.p-note{font-size:13px;color:var(--muted);padding-top:6px}
.prow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px 8px 14px;text-align:left;border-top:1px solid var(--line);position:relative}
.prow:first-child{border-top:0}
.prow:active{background:var(--surface-2)}
.prow .nm{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.3;display:flex;align-items:center;gap:6px;word-break:break-word}
.prow.cur{background:var(--accent-soft)}
.prow.cur::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.prow.first{box-shadow:inset 0 0 0 2px var(--accent)}
.prow .ok{width:20px;height:20px;color:var(--accent)}
.pill{flex:none;display:inline-flex;align-items:baseline;gap:4px}
.pill b{min-width:28px;height:28px;padding:0 9px;border-radius:9px;display:inline-grid;place-items:center;background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:600}
.pill small{font-size:12px;color:var(--muted)}
.pgroup{position:sticky;top:0;z-index:1;background:var(--surface);padding:12px 0 6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.plist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.addbox{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.switchline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer}
.switchline > span{display:flex;flex-direction:column}
.switchline small{color:var(--muted);font-size:13px}

/* code sheet */
.codebig{font-family:var(--mono);font-size:15px;line-height:1.45;word-break:break-all;user-select:text;-webkit-user-select:text;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.codemeta{margin:10px 0 14px;color:var(--muted);font-size:14px}

/* export */
.ex-top{display:flex;gap:16px;align-items:center}
.ex-top canvas{flex:none;width:96px;height:136px;border-radius:4px;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(0,0,0,.08);background:#fff}
.ex-top div{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.ex-top b{color:var(--ink);font-size:15px}
.radio{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ropt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.ropt:first-child{border-top:0}
.ropt input{position:absolute;opacity:0;pointer-events:none}
.ropt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.ropt input:checked + .rd{border-color:var(--accent)}
.ropt input:checked + .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.ropt input:focus-visible + .rd{outline:2px solid var(--accent);outline-offset:2px}
.ropt span{display:flex;flex-direction:column;flex:1}
.ropt small{color:var(--muted);font-size:13px}
.warn{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--dup-bg);color:var(--dup);font-size:14px;line-height:1.35}
.warn span{flex:1}
.result{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--ok-bg)}
.result b{color:var(--ok)}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;text-align:left;font-weight:500}
.navrow .ic{width:18px;height:18px;color:var(--muted)}
.ckrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.ckrow:first-child{border-top:0}
.ckrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ckrow span{flex:1;min-width:0}
.ckrow small{color:var(--muted)}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--bad-bg);transition:none}
.hold.go i{width:100%;transition:width 2s linear}
.hold span{position:relative}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}

/* snackbar, recover */
.snack{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sab) + 84px);transform:translate(-50%,12px);z-index:80;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s var(--ease)}
.snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{height:36px;padding:0 12px;border-radius:10px;font-weight:700;color:var(--on-ink);background:rgba(127,127,127,.25)}
.snack button[hidden]+span{display:none}
.recover{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.recover > div{max-width:420px;display:flex;flex-direction:column;gap:12px}
.recover h2{margin:0;font-size:20px}
.recover p{margin:0;color:var(--muted);line-height:1.45}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:150ms!important}
  .card-qty.pop{animation:none}
}
@media (min-width:760px){
  .cam-top,.cam-bottom{left:50%;right:auto;width:560px;transform:translateX(-50%)}
}
</style>

    codes: ds.codes.map(r => { const p = ds.products.find(x => x.id === r.p); return { c: r.c, name: p ? p.name : 'Без названия', t: r.t, ...(r.s ? { s: r.s } : {}) }; }),
  };
}
const currentDS = () => ({ products: S.products, codes: S.codes, started: S.count.started, ended: null, current: true });
async function saveBackup(ds = currentDS(), name) {

  const r = await saveBlob(name || 'QR_backup_' + diso(now()) + '.json', blob);

    snack('Копия сохранена', null, 2500); return true;

function previewRestore(d) {
  const local = new Map(S.products.map(p => [p.name, p]));
  const fileProds = new Map((d.products || []).filter(p => p && p.name).map(p => [String(p.name), p]));
  let fresh = 0, have = 0, other = 0; const newNames = new Set();
  const seen = new Set();
  for (const r of d.codes) {
    if (!r || !r.c || seen.has(r.c)) continue; seen.add(r.c);
    const name = String(r.name || 'Без названия');
    const ex = codeIdx.get(String(r.c));
    if (ex) { const lp = byId.get(ex.p); if (lp && lp.name === name) have++; else other++; continue; }
    if (holdIdx.has(String(r.c))) { have++; continue; }
    fresh++; if (!local.has(name)) newNames.add(name);
  }
  for (const n of fileProds.keys()) if (!local.has(n)) newNames.add(n);
  const at = d.at ? new Date(d.at).getTime() : null;
  if (recoverInfo && !fresh && !newNames.size) { resolveRecovery(); renderAll(); }
  if (!fresh && !newNames.size) {
    confirmSheet({ title: 'Загрузить копию', body: `<p class="hint" style="margin:0">${at ? 'Файл от ' + dshort(at) + ', ' + hm(at) + ' · ' : ''}${pl(seen.size, 'код', 'кода', 'кодов')}</p><p style="margin:10px 0 0">Все коды из файла уже есть.</p>`, buttons: [{ label: 'Закрыть', kind: 'ink' }] });
    return;
  }
  confirmSheet({
    title: 'Загрузить копию',
    body: `<p class="hint" style="margin:0">${at ? 'Файл от ' + dshort(at) + ', ' + hm(at) + ' · ' : ''}${pl(seen.size, 'код', 'кода', 'кодов')}</p>
      <div style="margin-top:10px">
        <div class="kv"><span>Новых</span><b>${fmtNum(fresh)}</b></div>
        <div class="kv"><span>Уже есть</span><b>${fmtNum(have)}</b></div>
        ${other ? `<div class="kv"><span>У другого товара (останутся как есть)</span><b>${fmtNum(other)}</b></div>` : ''}
        ${newNames.size ? `<div class="kv"><span>Новых товаров</span><b>${newNames.size}</b></div>` : ''}
      </div>`,
    buttons: [{ label: fresh ? 'Добавить ' + pl(fresh, 'код', 'кода', 'кодов') : 'Добавить товары', kind: 'ink', fn: () => applyRestore(d) }, { label: 'Отмена' }],
  });
}
function applyRestore(d) {
  const local = new Map(S.products.map(p => [p.name, p]));
  const createdP = [], addedC = [];
  const ensure = (name, info) => {
    let p = local.get(name);
    if (!p) { const half = info && info.half !== undefined ? !!info.half : catOf(name) === 'Пиво'; p = { id: 'c' + b36() + createdP.length, name, half, cat: info && CAT_ORDER.includes(info.cat) ? info.cat : catOf(name), custom: true }; S.products.push(p); local.set(name, p); createdP.push(p); }
    return p;
  };

/* =========================================================
   CSV
   ========================================================= */
function csvField(v) {
  if (typeof v === 'number') return fmtNum(v).replace(/ /g, '');
  let s = String(v);
  if (/[;"\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvCode(c) {
  if (/^\d{11,}$/.test(c)) return csvField('="' + c + '"');
  if (/^[=+\-@]/.test(c)) return csvField("'" + c);
  return csvField(c);
}
const csvTime = t => t ? dfile(t) + ' ' + hms(t) : '';
async function saveCSV(ds, kind) {
  const rows = [];
  const pOrder = ds.products.slice().sort((a, b) => {
    const ia = PRODUCTS.indexOf(a.name), ib = PRODUCTS.indexOf(b.name);
    if (ia >= 0 && ib >= 0) return ia - ib; if (ia >= 0) return -1; if (ib >= 0) return 1; return 0;
  });
  const by = new Map(); for (const r of ds.codes) { if (!by.has(r.p)) by.set(r.p, []); by.get(r.p).push(r); }
  for (const l of by.values()) l.sort((a, b) => a.t - b.t);
  const srcName = { cam: 'камера', photo: 'фото', kbd: 'сканер', imp: 'импорт' };
  if (kind === 'sum') {
    rows.push(['№', 'Категория', 'Товар', 'Количество', 'QR-кодов', 'Считать половинками', 'Первый скан', 'Последний скан'].join(';'));
    let i = 0, tot = 0;
    const list = ds.current ? pOrder : pOrder.filter(p => by.has(p.id));
    for (const p of list) {
      const l = by.get(p.id) || [], n = l.length; tot += n;
      rows.push([++i, csvField(p.cat || catOf(p.name)), csvField(p.name), csvField(p.half ? n / 2 : n), n, p.half ? 'да' : 'нет', csvTime(l[0] && l[0].t), csvTime(l[n - 1] && l[n - 1].t)].join(';'));
    }
    rows.push(';;Итого;;' + tot + ';;;');
  } else {
    rows.push(['№', 'Категория', 'Товар', '№ в товаре', 'Код', 'Кол-во', 'Дата', 'Время', 'Источник'].join(';'));
    let i = 0;
    for (const p of pOrder) {
      const l = by.get(p.id); if (!l) continue;
      l.forEach((r, j) => rows.push([++i, csvField(p.cat || catOf(p.name)), csvField(p.name), j + 1, csvCode(r.c), csvField(p.half ? 0.5 : 1), dfile(r.t), hms(r.t), srcName[r.s] || '—'].join(';')));
    }
  }
  const blob = new Blob(['﻿' + rows.join('\r\n') + '\r\n'], { type: 'text/csv' });
  const name = 'QR_' + (kind === 'sum' ? 'summary' : 'codes') + '_' + diso(ds.archive ? ds.started : now()) + (ds.archive ? '_архив' : '') + '.csv';
  const r = await saveBlob(name, blob);
  snack(r === 'saved' ? 'Таблица сохранена' : saveMsg(r), null, 2500);
}

async function tryRecover() {

    }

  const kept = recoverInfo.saved || idbSaved;

  el.innerHTML = `<div><h2>Не удалось прочитать сохранённые данные</h2><p>${kept ? 'Мы сохранили их отдельно и ничего не удалили.' : 'Сохранить их отдельно не удалось — сначала скачайте сырые данные.'}</p>
    <button class="btn out" type="button" id="rcRaw">Скачать сырые данные</button>
    <button class="btn out" type="button" id="rcLoad">Загрузить копию</button>
    <button class="btn ink" type="button" id="rcNew">Начать заново</button></div>`;
  el.hidden = false;
  $('#rcRaw').onclick = async () => { const r = await saveBlob('QR_raw_' + diso(now()) + '.json', new Blob([recoverInfo ? recoverInfo.raw : ''], { type: 'application/json' })); if (r === 'saved' && recoverInfo) recoverInfo.downloaded = true; };
  $('#rcLoad').onclick = () => $('#restoreIn').click();
  $('#rcNew').onclick = () => {
    if (!kept && !recoverInfo.downloaded) {
      confirmSheet({ title: 'Начать заново?', body: '<p style="margin:0;line-height:1.45">Старые данные не сохранены отдельно и будут потеряны. Сначала скачайте сырые данные.</p>',
        buttons: [{ label: 'Начать заново', kind: 'bad', fn: () => { resolveRecovery(); renderAll(); } }, { label: 'Отмена' }] });
      el.hidden = true; const back = () => { if (recoverInfo) el.hidden = false; };
      setTimeout(() => { const m = sheetMeta.get('sh-confirm'); if (m) m.onHide = back; }, 0);

  };
}
